
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
          fi

      - name: Build
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "No build required for static HTML."
          fi

      - name: Prepare website files
        run: |
          if [ -d dist ]; then
            echo "Using dist directory."
          elif [ -f index.html ]; then
            echo "Using repository root."
            mkdir -p dist
            cp -r . dist/
            rm -rf dist/.git dist/.github dist/node_modules
          else
            echo "ERROR: No dist directory or root index.html found."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
